
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docentes | EDUINFO</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

<header class="page-header">
    <h1>👩‍🏫 Panel de Docentes</h1>
    <p>Publica talleres, tareas y materiales de apoyo para tus estudiantes.</p>
</header>

<nav class="menu-principal">
    <a href="index.html">Inicio</a>
    <a href="materia.html">Materias</a>
    <a href="docente.html">Docentes</a>
    <a href="tareas.html">Tareas</a>
    <a href="contacto.html">Contacto</a>
</nav>

<main class="teacher-section">
    <div class="teacher-card">

        <h2>📄 Publicar una actividad</h2>

        <form id="formActividad">

            <div class="input-group">
                <label for="docente">Nombre del docente</label>
                <input type="text" id="docente" required>
            </div>

            <div class="input-group">
                <label for="grado">Nivel educativo</label>
                <select id="grado" required>
                    <option value="">Seleccionar nivel</option>
                    <option value="Básica Primaria">Básica Primaria</option>
                    <option value="Básica Secundaria">Básica Secundaria</option>
                </select>
            </div>

            <div class="input-group">
                <label for="materia">Materia</label>
                <select id="materia" required>
                    <option value="">Seleccionar materia</option>
                    <option value="Matemáticas Básica">Matemáticas Básica</option>
                    <option value="Lengua Castellana">Lengua Castellana</option>
                    <option value="Ciencias Naturales">Ciencias Naturales</option>
                    <option value="Sociales">Sociales</option>
                    <option value="Matemáticas">Matemáticas</option>
                    <option value="Química">Química</option>
                    <option value="Física">Física</option>
                    <option value="Tecnología e Informática">Tecnología e Informática</option>
                    <option value="Inglés">Inglés</option>
                    <option value="Educación Artística">Educación Artística</option>
                </select>
            </div>

            <div class="input-group">
                <label for="titulo">Título de la actividad</label>
                <input type="text" id="titulo" required>
            </div>

            <div class="input-group">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" rows="5" required></textarea>
            </div>

            <div class="input-group">
                <label for="archivo">Adjuntar documento</label>
                <input type="file" id="archivo"
                    accept=".pdf,.doc,.docx,.ppt,.pptx">
                <small>Máximo 5 MB. PDF, Word o PowerPoint.</small>
            </div>

            <div class="buttons">
                <button type="submit" class="btn-primary">
                    📤 Publicar actividad
                </button>

                <button type="reset" class="btn-secondary">
                    Limpiar
                </button>
            </div>

        </form>

        <section id="resultado" hidden>
            <h2>✅ Actividades publicadas</h2>
            <div id="contenidoActividad"></div>
        </section>

    </div>
</main>

<script src="js/actividades.js"></script>

</body>
</html>
