<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel Docente | Plataforma Escolar</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <!-- ENCABEZADO -->
    <header class="page-header">

        <h1>👩‍🏫 Panel de Docentes</h1>

        <p>
            Desde este espacio los docentes podrán publicar talleres,
            guías, tareas y material de apoyo para que los estudiantes
            continúen aprendiendo desde casa.
        </p>

    </header>

    <!-- MENÚ PRINCIPAL -->
    <nav class="menu-principal">

        <a href="index.html">Inicio</a>
        <a href="materias.html">Materias</a>
        <a href="docentes.html">Docentes</a>
        <a href="tareas.html">Tareas</a>
        <a href="contacto.html">Contacto</a>

    </nav>

    <!-- FORMULARIO PARA PUBLICAR ACTIVIDADES -->
    <section class="teacher-section">

        <div class="teacher-card">

            <h2>📄 Publicar una actividad</h2>

            <form action="#" method="post" enctype="multipart/form-data">

                <div class="input-group">
                    <label for="docente">Nombre del docente</label>

                    <input
                        type="text"
                        id="docente"
                        name="docente"
                        placeholder="Escriba su nombre completo"
                        required>
                </div>

                <div class="input-group">
                    <label for="grado">Nivel educativo</label>

                    <select id="grado" name="grado" required>
                        <option value="">Seleccione...</option>
                        <option value="primaria">Básica Primaria</option>
                        <option value="secundaria">Básica Secundaria</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="materia">Materia</label>

                    <select id="materia" name="materia" required>
                        <option value="">Seleccione...</option>
                        <option>Matemáticas</option>
                        <option>Lengua Castellana</option>
                        <option>Ciencias Naturales</option>
                        <option>Ciencias Sociales</option>
                        <option>Tecnología e Informática</option>
                        <option>Inglés</option>
                        <option>Educación Artística</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="titulo">Título de la actividad</label>

                    <input
                        type="text"
                        id="titulo"
                        name="titulo"
                        placeholder="Ejemplo: Taller de Fracciones"
                        required>
                </div>

                <div class="input-group">
                    <label for="descripcion">Descripción</label>

                    <textarea
                        id="descripcion"
                        name="descripcion"
                        rows="5"
                        placeholder="Escriba una descripción de la actividad..."
                        required></textarea>
                </div>

                <div class="input-group">
                    <label for="archivo">Subir archivo</label>

                    <input
                        type="file"
                        id="archivo"
                        name="archivo"
                        accept=".pdf,.doc,.docx,.ppt,.pptx">
                </div>

                <div class="buttons">

                    <button type="submit" class="btn-primary">
                        📤 Publicar Actividad
                    </button>

                    <a href="index.html" class="btn-secondary">
                        🏠 Volver al Inicio
                    </a>

                </div>

            </form>

        </div>

    </section>

</body>

</html>
